# Tool descriptions
tools:
  search: |
    Search codebases using Sourcegraph.

    **Critical for this instance**: Do NOT use bare double quotes (e.g. `"foo bar"` returns no results) and do NOT rely on space-separated keywords (unreliable in standard mode). Use `content:"..."` for phrases and explicit `AND` between keywords.

    **Parameters:**
    - query (required): The search query string
    - limit (optional): Maximum number of results to return (default: 30, min: 1, max: 100)
    - pattern_type (optional): Search pattern type, matching the Sourcegraph web UI modes.
      One of "standard" (default), "keyword", or "regexp":
      - "standard": literal search. `foo bar` matches the adjacent literal phrase "foo bar";
        join multiple keywords with explicit `AND` (`foo AND bar`). Supports `content:"..."`
        phrases, boolean `AND`/`OR`/`NOT`, and `/.../` inline regex.
      - "keyword": each whitespace-separated term must appear somewhere in the file
        (content or path): `foo bar` matches files containing both `foo` and `bar`.
      - "regexp": the entire query pattern is interpreted as a single RE2 regular
        expression (e.g. `func\..*Search`); whitespace is part of the regex.
      A `patternType:` filter inside the query overrides this parameter.

    **Quick Reference:**
    - Default search: `error AND handler` (searches file content that includes both `error' and `handler')
    - Phrase with special chars (spaces, colons, quotes): `content:"search text"`, escape inner quotes as `\"` (e.g. `content:"func foo(\"bar\")"`)
    - Repository filter: `repo:github\.com/org/project` (regex; alias `r:`)
    - File path filter: `file:\.go$` (regex; alias `f:`)
    - Language filter: `lang:python`
    - Negation: `-file:test` (exclude test files) `-repo:lab` (exclude lab repos)
    - Boolean operators: `error AND handler`, `lang:java OR lang:kotlin`
    - Regex search: pass `pattern_type="regexp"` with a raw RE2 query (e.g. `func\..*Search`)
    - Symbol search: `type:symbol` for functions/classes
    - Repository search: `repo:org type:repo` for finding repos

    **Examples:**
    1. Find Go function definitions: `content:"func SendMessage" lang:go`
    2. Find Python class definitions: `content:"class UserService" lang:python`
    3. Find Go struct definitions: `content:"type UserService struct" lang:go`
    4. Find API endpoints: `router.Get lang:go` or `content:"@app.route" lang:python`
    5. Find configuration files: `file:config` or `file:\.(properties|yaml|yml|conf|ini|toml)$`
    6. Exclude test files: `content:"func Process" -file:test`
    7. Find repositories: `repo:github\.com/kubernetes type:repo`

    **Tips:**
    - Call `search_prompt_guide` first before any search to learn the full syntax.
    - Keep to 3 or fewer keywords (`foo AND bar AND baz`).
    - Use `content:"..."` for exact phrases or any text containing quotes, colons, or spaces.
    - For precise/complex patterns, pass `pattern_type="regexp"` with a raw regex query instead of escaping special chars.

  search_prompt_guide: >
    Call this BEFORE ANY search when you are not certain of this instance's query syntax. It returns the full query syntax guide, including the `content:"..."` and explicit `AND` rules this instance requires.

  fetch_content: |
    Fetches file content or directory structure from repositories.

    **Parameters:**
    - repo (required): Repository path (e.g., "github.com/org/project")
    - path (optional): File or directory path within the repository

    **Returns:**
    - If path is a file: the file content (files larger than 1MB are truncated)
    - If path is a directory or empty: directory tree listing (depth 2)
    - Binary files: a short note instead of raw bytes

    **Usage tips:**
    - Use with `search`: search for discovery, fetch_content for exploration.
    - Start with root directory (empty path) to understand project layout.
    - Check README.md, package.json, go.mod, requirements.txt for context.
    - Prefer `search` for discovery; fetch only specific, smaller files.

    **Examples:**
    - `repo="github.com/kubernetes/kubernetes" path=""` — repo root listing (start here)
    - `repo="github.com/kubernetes/kubernetes" path="README.md"` — single file content
    - `repo="github.com/golang/go" path="src"` — directory tree
    - `repo="github.com/golang/go" path="src/runtime/proc.go"` — specific file content
    - `repo="github.com/facebook/react" path="package.json"` — configuration file

# Guides
guides:
  codesearch_guide: |
    # Sourcegraph Query Language Guide

    > **This instance**: Do NOT use bare double quotes (e.g. `"foo bar"` returns no results) and do NOT rely on space-separated keywords (unreliable in standard mode). Use `content:"..."` for phrases and explicit `AND` between keywords.

    ## Syntax Overview

    A Sourcegraph query consists of:
    - **Search pattern**: Terms to search (e.g., `println`)
    - **Search filters**: Scope limiters (e.g., `lang:java`)

    ## Search Pattern Types

    The `pattern_type` tool parameter selects how the query pattern is interpreted
    (mirroring the pattern modes in the Sourcegraph web UI). A `patternType:` filter
    inside the query overrides it.

    ### Standard Search (pattern_type="standard", Default)
    | Pattern | Description | Example |
    |---------|-------------|---------|
    | `foo AND bar` | Both terms (set intersection). Join multiple keywords with explicit `AND` instead of spaces | `error AND handler` |
    | `content:"foo bar"` | Literal phrase, including spaces/colons/quotes. Escape inner double quotes as `\"` | `content:"connection error"` |
    | `foo bar` | Adjacent literal phrase "foo bar" — NOT implicit AND | `error handler` |
    | `/foo.*bar/` | Inline regular expression | `/func.*test/` |
    | `foo OR bar` | Either term | `error OR warning` |

    ### Keyword Search (pattern_type="keyword")
    Every whitespace-separated term must appear somewhere in the file (content or path).
    | Pattern | Description | Example |
    |---------|-------------|---------|
    | `foo bar` | Files containing both terms anywhere | `error handler` |
    | `"foo bar"` | Exact phrase | `"func main"` |
    | `/foo.*bar/` | Inline regular expression | `/func.*test/` |

    ### Regular Expression Search (pattern_type="regexp")
    The entire pattern is one RE2 regular expression; whitespace is part of the regex
    (use `\s` to match whitespace explicitly).
    | Pattern | Description | Example |
    |---------|-------------|---------|
    | `func\..*Search` | Regex match per line | `func\..*Search` |
    | `fmt\.(Print\|Sprint)` | Regex alternation | `fmt\.(Print\|Sprint)` |

    You can also force regex per-query with the `patterntype:regexp` filter, or write
    slash-delimited inline patterns like `/foo.*bar/` in standard mode.

    ## Filters Reference

    ### General Filters
    | Filter | Description | Examples |
    |--------|-------------|----------|
    | `repo:regexp` | Include repos matching pattern (alias `r:`) | `repo:github\.com/sourcegraph` |
    | `-repo:regexp` | Exclude repos | `-repo:test` |
    | `file:regexp` | Include files matching path (alias `f:`) | `file:\.go$` |
    | `-file:regexp` | Exclude files | `-file:test` |
    | `lang:name` | Filter by language | `lang:typescript` |
    | `type:symbol` | Symbol search | `type:symbol HTTPServer` |
    | `type:repo` | Repository search | `type:repo backend` |

    ### Advanced Filters
    | Filter | Description | Examples |
    |--------|-------------|----------|
    | `select:repo` | Show only repos | `error select:repo` |
    | `select:file` | Show only files | `TODO select:file` |

    ## Boolean Operators

    - **AND** (or `and`): set intersection. Join multiple keywords with `AND` instead of spaces
    - **OR** (or `or`): either term
    - **NOT** (or `-` prefix): exclude

    ```
    lang:go AND error
    lang:java OR lang:kotlin
    error NOT test
    error -warning
    ```

    ## Examples

    1. **Find Python class definitions**: `content:"class MyClass" lang:python`
    2. **Find function implementations**: `SendMessage lang:go -file:test`
    3. **Search multiple repos**: `repo:org/projectA|org/projectB error`
    4. **Exclude test files**: `content:"func Process" -file:test -file:mock`
    5. **Find TODOs in Go**: `TODO lang:go select:file`

    ## Common Patterns

    - **Function definitions**: `type:symbol FunctionName lang:go`
    - **Class definitions**: `content:"class ClassName" lang:python`
    - **Literal search**: `content:"func ProcessOrder" lang:go`
    - **API routes**: `router.HandleFunc lang:go`
    - **Imports**: `content:"from package" lang:python`
    - **Config files**: `file:config`

    ## Progressive Search Strategy

    1. **Start broad**: `ProcessOrder` - search everywhere
    2. **Find repositories**: `ProcessOrder type:repo` - discover relevant repos
    3. **Explore with fetch_content**: use empty path for repo overview, README/docs for context
    4. **Progressively refine**: add filters and `content:"..."` phrases
    5. **Exclude noise**: exclude test files: `ProcessOrder -file:test lang:go`
    6. **Target repos**: `repo:order-service ProcessOrder lang:go`

    ## Tips

    - Start simple, add filters incrementally
    - Escape special chars: `\.` for literal dot
    - Combine filters: `repo:backend lang:go file:handler`
    - Don't do too complex regex searches
    - Keep to 3 or fewer keywords per query
    - Avoid broad searches with multiple unrelated keywords - this only generates noise

